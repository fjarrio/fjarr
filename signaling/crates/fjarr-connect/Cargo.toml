# fjarr-connect — the operator end of a network tunnel, and Fjarr's first non-browser operator.
# Data channels only, no media, so it needs no GStreamer and ships as one binary (ADR-0024).
# spec: docs/27-network-tunnel.md · docs/09-interfaces.md#operator-api
[package]
name = "fjarr-connect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Fjarr operator client: a routable address for one robot (docs/27)"

[dependencies]
# The wire types, shared with the server rather than restated, so drift is a compile error.
fjarr-protocol = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
webrtc = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
bytes = "1"
# The TUN ioctl and the two unbuffered device reads/writes; no wrapper crate for three calls. Also
# termios and the window size for `shell` on Unix (docs/27#shell).
libc = "0.2"
# The loopback login's `state`, from the OS on every platform `shell` builds for (docs/14).
getrandom = "0.3"
async-trait = "0.1"
# The operator API (docs/09#operator-api): robots, grants, login codes. Same rustls build as the server.
reqwest = { workspace = true }
# The picker — type to filter, enter to connect (docs/27#what-it-feels-like).
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
# ~/.config/fjarr/config.toml and the 0600 credential beside it (docs/27#configuration).
toml = "0.8"
dirs = "6"
# The address derivation (docs/27#addressing), so `list --ssh-config` can print a stanza a robot
# will actually answer at. Pinned by test vectors against the agent's own derivation.
sha2 = "0.10"

# Linux's network configuration is netlink; macOS's is ioctls and a PF_ROUTE socket, so neither
# platform links the other's mechanism.
[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink = "0.23.0"
# The persistent device itself, shared with fjarr-setup (docs/26#the-setup-tool).
fjarr-netdev = { path = "../fjarr-netdev" }

# `shell`'s raw mode and window size on Windows: the console API, with virtual-terminal input so
# keys arrive as the escape sequences the robot's pty expects (docs/27#shell, docs/04).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
