# spec: docs/32-fleet-ota.md#jetson-test-image
# A slot that cannot come up must use up its tries (each a warm reset L4TLauncher counts), not
# wait at a console nobody watches. As on x86.
[Service]
ExecStartPre=-/bin/sh -c 'echo "fjarr: emergency mode, rebooting in 30 s" > /dev/console; sleep 30'
ExecStart=
ExecStart=/usr/bin/systemctl reboot
