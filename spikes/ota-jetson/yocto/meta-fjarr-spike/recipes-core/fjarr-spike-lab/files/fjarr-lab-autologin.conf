# spec: docs/32-fleet-ota.md#jetson-test-image (L2: a way into the box when its network is not)
# Lab images only: root on the debug UART's console without a password. The mini-PC holds that
# UART (/dev/fjarr-box-uart) and can type on it, so a slot whose network does not come up can
# still be looked at. Never in a product image.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -8 -L --autologin root %I 115200 $TERM
