# spec: docs/32-fleet-ota.md#jetson-test-image
# The slot's systemd keeps the watchdog the initrd opened (30 s), and bounds a hung reboot.
# A crashed PID 1 reboots: freezing (the default) closes every descriptor, the watchdog's too, and
# nothing resets the box (D2b, 2026-11-14).
[Manager]
CrashReboot=yes
RuntimeWatchdogSec=30s
RebootWatchdogSec=2min
