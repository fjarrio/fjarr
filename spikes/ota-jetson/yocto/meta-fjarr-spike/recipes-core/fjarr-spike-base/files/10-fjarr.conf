# spec: docs/32-fleet-ota.md#jetson-test-image
# Host keys are machine state on /data, as on x86; the lab image's own copies in /etc/ssh (the
# same keys) still answer when /data is not mounted. Root logs in with the lab key only.
HostKey /data/ssh/ssh_host_ed25519_key
HostKey /data/ssh/ssh_host_ecdsa_key
HostKey /data/ssh/ssh_host_rsa_key
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_ecdsa_key
HostKey /etc/ssh/ssh_host_rsa_key
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
