# The 8.0 Jetson test image's layer: the ZED Box Mini machine, the spike distro and image.
# spec: docs/32-fleet-ota.md#jetson-test-image
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "fjarr-spike"
BBFILE_PATTERN_fjarr-spike = "^${LAYERDIR}/"
BBFILE_PRIORITY_fjarr-spike = "20"

LAYERVERSION_fjarr-spike = "1"
LAYERSERIES_COMPAT_fjarr-spike = "scarthgap"
LAYERDEPENDS_fjarr-spike = "core tegra openembedded-layer swupdate"

# The spike's sibling directories (spikes/ota-jetson/{applier,board,.lab}), which recipes reach
# by relative path from here.
FJARR_SPIKE_DIR := "${@os.path.normpath('${LAYERDIR}/../..')}"
