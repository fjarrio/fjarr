# The 8.0 spike distro: poky with systemd and only the features a headless update test needs.
# spec: docs/32-fleet-ota.md#jetson-test-image
require conf/distro/poky.conf

DISTRO = "fjarr-spike"
DISTRO_NAME = "Fjarr OTA spike"
DISTRO_CODENAME = "m8-8.0"

# The release version the image reports (os-release IMAGE_VERSION) and carries as its root
# filesystem label (fjarr_<version>), as on x86. A second build for the update tests sets it
# with FJARR_IMAGE_VERSION in the environment (build.sh --image-version).
FJARR_IMAGE_VERSION ??= "1.0"
DISTRO_VERSION = "${FJARR_IMAGE_VERSION}"

INIT_MANAGER = "systemd"

# Headless, wired, no graphics stack: fewer recipes to build and nothing unused in the slot.
# efi: systemd is built with its EFI support only with it, and only then mounts efivarfs, in the
# initrd and the slot. Without it the slot-root rule cannot read BootChainOsCurrent, no
# /dev/fjarr/root appears, and the slot never boots (D1, 2026-11-13).
DISTRO_FEATURES = "acl efi ext2 ipv4 ipv6 largefile pci seccomp usbhost vfat xattr"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "pulseaudio gobject-introspection-data"

# SWUpdate 2025.12, the version the x86 spike measured (docs/32#x86-swupdate-ebg), so both
# recipes run the same engine.
PREFERRED_VERSION_swupdate = "2025.12"
