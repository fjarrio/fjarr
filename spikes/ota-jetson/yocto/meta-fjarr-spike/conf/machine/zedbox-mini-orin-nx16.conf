#@TYPE: Machine
#@NAME: Stereolabs ZED Box Mini, Orin NX 16 GB (8.0 spike)
#@DESCRIPTION: Orin NX 16 GB (P3767-0000) on the ZED Box Mini carrier, NVMe root A/B with /data
#
# spec: docs/32-fleet-ota.md#jetson-test-image
# Builds on meta-tegra's p3509-a02-p3767-0000, the board configuration Stereolabs' flash script
# uses. The name stays at 31 characters or fewer, a limit of the bootloader update payloads.

MACHINEOVERRIDES =. "p3509-a02-p3767-0000:"

# --- Power mode: non-super, as Stereolabs ships the box -----------------------------------
# meta-tegra's orin-nx.inc defaults to super mode since L4T 36.4.3 (BPMP DTB, kernel DTB and
# nvpmodel). These are the non-super equivalents p3509-a02-p3767-0000.conf uses in NVIDIA's L4T.
NVPMODEL = "nvpmodel_p3767_0000"
TEGRA_FLASHVAR_BPFDTB_FILE = "tegra234-bpmp-3767-0000-a02-3509-a02.dtb"

# --- Layout: NVIDIA's NVMe A/B table, 16 GiB slots, /data for the rest ----------------------
# USE_REDUNDANT_FLASH_LAYOUT selects the A/B QSPI and NVMe layouts and adds meta-tegra's
# RootfsRedundancyLevel overlay. ROOTFSPART_SIZE_DEFAULT is halved per slot: 32 GiB -> 16 GiB.
USE_REDUNDANT_FLASH_LAYOUT_DEFAULT = "1"
ROOTFSPART_SIZE_DEFAULT = "34359738368"
# NVIDIA's flash_l4t_t234_nvme_rootfs_ab.xml plus the fjarr-data partition, which
# tegra-storage-layout-base_%.bbappend derives from NVIDIA's file at build time (NVIDIA's XML
# is not redistributable, so the layer carries only the change).
PARTITION_LAYOUT_EXTERNAL_REDUNDANT = "flash_l4t_t234_nvme_rootfs_ab_fjarr_data.xml"

# --- Boot state: L4TLauncher's retry count, pinned to NVIDIA's default (Q5) -----------------
# The overlay (recipes-bsp/uefi/fjarr-l4t-config_1.0.bb) is added to TEGRA_BOOTCONTROL_OVERLAYS
# below the require, after meta-tegra's own two.
FJARR_ROOTFS_RETRY_COUNT_MAX ?= "3"

# --- Kernel, device tree and command line, all in the slot ---------------------------------
# extlinux.conf names the kernel, the initrd and the device tree in /boot of each slot, so they
# switch with it; without UBOOT_EXTLINUX_FDT the kernel would get the device tree from QSPI.
UBOOT_EXTLINUX = "1"
UBOOT_EXTLINUX_FDT = "${DTBFILE}"
#
# Fjarr's carrier device tree from the board package (spikes/ota-jetson/board/dt/, built by
# recipes-bsp/devicetree/zedbox-mini-devicetree_1.0.bb). FJARR_BOARD_DT = "0" puts NVIDIA's
# non-super P3767 device tree in the slot instead.
FJARR_BOARD_DT ?= "1"
KERNEL_DEVICETREE = "${@'tegra234-p3768-0000+p3767-0000-zedbox-mini.dtb' if d.getVar('FJARR_BOARD_DT') == '1' else 'tegra234-p3768-0000+p3767-0000-nv.dtb'}"
PREFERRED_PROVIDER_virtual/dtb = "${@'zedbox-mini-devicetree' if d.getVar('FJARR_BOARD_DT') == '1' else 'nvidia-kernel-oot-dtb'}"
#
# The slot's root is the APP partition of the chain L4TLauncher booted (BootChainOsCurrent),
# named /dev/fjarr/root by a udev rule in the initrd (fjarr-slot-root). A trial that cannot
# come up resets warm: the root wait is bounded, a panic reboots, and the initrd's systemd
# opens the watchdog and reboots from emergency mode (fjarr-spike-initramfs).
FJARR_KERNEL_ARGS = "root=/dev/fjarr/root rootfstype=ext4 rootflags=x-systemd.device-timeout=90s rw panic=10"
KERNEL_ARGS = "mminit_loglevel=4 console=ttyTCU0,115200 firmware_class.path=/etc/firmware fbcon=map:0 video=efifb:off console=tty0 efi=runtime nvme.use_threaded_interrupts=1 pci=pcie_bus_perf ${FJARR_KERNEL_ARGS}"
INITRAMFS_IMAGE = "fjarr-spike-initramfs"

# --- Bootloader files (BCT) ---------------------------------------------------------------
# Fjarr's MB1 pinmux and GPIO patch and its own MB2 file without the carrier EEPROM read, from
# the board package (spikes/ota-jetson/board/bct/), installed by tegra-bootfiles_%.bbappend.
# With FJARR_BOARD_BCT = "0" the build takes NVIDIA's p3509 files, whose MB2 stops on the
# ZED Box Mini (it reads a carrier EEPROM the box does not have): never flash such a build.
FJARR_BOARD_BCT ?= "1"
TEGRA_FLASHVAR_PINMUX_CONFIG = "${@'tegra234-mb1-bct-pinmux-p3767-hdmi-a03-zedbox-mini.dtsi' if d.getVar('FJARR_BOARD_BCT') == '1' else 'tegra234-mb1-bct-pinmux-p3767-hdmi-a03.dtsi'}"
TEGRA_FLASHVAR_MB2BCT_CFG = "${@'tegra234-mb2-bct-misc-p3767-0000-zedbox-mini.dts' if d.getVar('FJARR_BOARD_BCT') == '1' else 'tegra234-mb2-bct-misc-p3767-0000.dts'}"

# p3509-a02-p3767-0000.conf, orin-nx.inc and tegra-common.inc set the variables above with ?=,
# so the values here win.
require conf/machine/p3509-a02-p3767-0000.conf

# After the require: tegra-common.inc sets this list with ?= (L4TConfiguration.dtbo, then the
# RootfsRedundancyLevel overlay), and the overlays apply in order.
TEGRA_BOOTCONTROL_OVERLAYS += "L4TConfiguration-FjarrRootfsRetryCountMax.dtbo"
