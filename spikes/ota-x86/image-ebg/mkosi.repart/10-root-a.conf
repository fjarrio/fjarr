# %M_%A = IMAGE_ID_IMAGE_VERSION from the image's os-release: fjarr_1.0.
[Partition]
Type=root
Label=%M_%A
# Slots are addressed by fixed PARTUUIDs; the GPT label goes stale after a raw write.
UUID=4f8a1c2e-6b1d-4c57-9a0e-2d3f5b7a1101
Format=ext4
CopyFiles=/
SizeMinBytes=16G
SizeMaxBytes=16G
SplitName=%t
