# EBG config partition of slot B: BGENV.DAT, EFILABEL (BOOT1) and the slot's UKI as fjarr.efi.
# ESP type so mkosi fills it after the UKI exists; EBG's tools accept ESP and basic-data types.
# On a fresh disk both hold slot A's UKI, so the second environment is a working fallback.
[Partition]
Type=esp
Label=fjarr-boot1
Format=vfat
CopyFiles=/usr/lib/fjarr/ebg/boot1:/
CopyFiles=/boot/EFI/Linux/%M_%A.efi:/fjarr.efi
SizeMinBytes=256M
SizeMaxBytes=256M
SplitName=-
