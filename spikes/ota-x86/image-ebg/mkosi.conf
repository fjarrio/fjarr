# The 8.0 comparison image: the same A/B slots booted by EFI Boot Guard and written by SWUpdate
# (docs/adr/0039 revisited). Build with
#   spikes/ota-x86/build.sh image-ebg --image-version=1.0
# Each slot has its own EBG config partition (fjarr-boot0/1) holding BGENV.DAT and that slot's UKI,
# which pins root=LABEL=fjarr_<version>: a raw slot write carries the ext4 label, not the GPT one.
[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=universe
# Pinned inputs, so a rebuild is byte-identical and a delta carries only real change
# (docs/32#x86-test-image). snapshot.ubuntu.com IDs: `mkosi latest-snapshot`.
Snapshot=20261007T000000Z

[Output]
# Fixes the partition and filesystem UUIDs systemd-repart would otherwise randomise.
Seed=a1543721-495a-5d35-83a6-ed9c78784806
Format=disk
ImageId=fjarr
Output=%i_%v
SplitArtifacts=uki,partitions
CompressOutput=no

[Build]
WithNetwork=yes
SourceDateEpoch=1791331200

[Content]
# EFI Boot Guard 0.22's loader (Ubuntu 26.04 has 0.19, without the v0.20 rollback fix), sha256-pinned
# by build.sh's caller: spikes/ota-x86/out/ebg/loader/efibootguardx64.efi.
ExtraTrees=../out/ebg/loader:/usr/lib/fjarr/ebg
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
UnifiedKernelImageFormat=%i_%v
# The initrd only has to find the root partition: mkosi-initrd's default set plus NVMe.
KernelInitrdModules=default
        /drivers/nvme/
        /drivers/watchdog/wdat_wdt
        /drivers/watchdog/iTCO_wdt
        /drivers/watchdog/i6300esb
Hostname=fjarr-nuc
Timezone=UTC
Locale=C.UTF-8
RootPassword=hashed:!
Ssh=never
WithDocs=no
# Build-time logs and caches that record when the image was built (found by the 8.0 R0 rebuild).
RemoveFiles=/var/log/alternatives.log
            /var/cache/ldconfig/aux-cache
# Never gpt-auto or root=dissect: both take the newest root partition and defeat a rollback.
# The root stays read-write in 8.0 (Ubuntu keeps dpkg's database in /var; docs/32 records it).
KernelCommandLine=root=LABEL=%i_%v rootflags=x-systemd.device-timeout=90s rw systemd.gpt_auto=0 panic=10 systemd.watchdog_sec=30
                  watchdog.handle_boot_enabled=0
                  console=ttyS0,115200 console=tty0
Packages=
        linux-image-generic
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        systemd-container
        systemd-resolved
        systemd-timesyncd
        udev
        dbus
        openssh-server
        sudo
        e2fsprogs
        dosfstools
        fdisk
        efibootguard
        swupdate
        efibootmgr
        iproute2
        iputils-ping
        curl
        ca-certificates
        zstd
        less
        nano
