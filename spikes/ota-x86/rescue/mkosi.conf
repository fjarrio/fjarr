# fjarr-lab-rescue (M8 slice 8.0, docs/32#x86-test-image): one UKI holding a small Ubuntu
# that runs from RAM. It is the installer that rewrites the lab machine's disk and the
# permanent rescue system kept on both ESPs.
[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=universe

[Output]
Format=uki
ImageId=fjarr-rescue
Output=fjarr-rescue
CompressOutput=zstd

[Build]
WithNetwork=yes

[Content]
Bootable=yes
Bootloader=uki
Hostname=fjarr-nuc-rescue
Timezone=UTC
Locale=C.UTF-8
RootPassword=hashed:!
# Ubuntu's own ssh.socket on port 22; mkosi's Ssh= would replace it with a vsock-only listener.
Ssh=never
WithDocs=no
CleanPackageMetadata=yes
# panic=10: a crash resets the machine, and BootNext (consumed) lands in the old system.
# i915.modeset=0 and the NVMe power-state limit: kexec and resume hangs reported on similar
# Intel NUCs (research 2026-10-13).
KernelCommandLine=console=ttyS0,115200 console=tty0 panic=10 i915.modeset=0 nvme_core.default_ps_max_latency_us=0
                  systemd.watchdog_sec=30
Packages=
        linux-image-generic
        systemd
        systemd-sysv
        systemd-resolved
        systemd-timesyncd
        systemd-repart
        systemd-boot-efi
        udev
        dbus
        openssh-server
        iproute2
        iputils-ping
        curl
        ca-certificates
        zstd
        efibootmgr
        gdisk
        fdisk
        parted
        nvme-cli
        e2fsprogs
        dosfstools
        kexec-tools
        util-linux
        pciutils
        less
        nano
        rsync
# The whole OS is the initrd: keep the modules a NUC needs, not every driver Ubuntu ships.
KernelModules=
        /drivers/nvme/
        /drivers/net/ethernet/intel/
        /drivers/net/ethernet/realtek/
        /drivers/net/usb/
        /drivers/usb/
        /drivers/hid/
        /drivers/input/
        /drivers/watchdog/
        /drivers/mfd/lpc_ich
        /drivers/ata/
        /drivers/scsi/
        /drivers/md/dm-mod
        /fs/
        /crypto/
        /lib/
        efivarfs
        loop
        virtio
        virtio_.*
        /drivers/virtio/
        /drivers/block/virtio_blk
        /drivers/net/virtio_net
