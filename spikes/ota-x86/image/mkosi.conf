# The 8.0 A/B slot image (docs/32#x86-test-image). Build with
#   spikes/ota-x86/build.sh image --image-version=1.0
# Each UKI is fjarr_<version>.efi and pins root=PARTLABEL=fjarr_<version>.
[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=universe

[Output]
Format=disk
ImageId=fjarr
Output=%i_%v
SplitArtifacts=uki,partitions
CompressOutput=no

[Build]
WithNetwork=yes

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
UnifiedKernelImageFormat=%i_%v
# The initrd only has to find the root partition: mkosi-initrd's default set plus NVMe.
KernelInitrdModules=default
        /drivers/nvme/
        /drivers/watchdog/iTCO_wdt
        /drivers/watchdog/i6300esb
Hostname=fjarr-nuc
Timezone=UTC
Locale=C.UTF-8
RootPassword=hashed:!
Ssh=never
WithDocs=no
# Never gpt-auto or root=dissect: both take the newest root partition and defeat a rollback.
# The root stays read-write in 8.0 (Ubuntu keeps dpkg's database in /var; docs/32 records it).
KernelCommandLine=root=PARTLABEL=%i_%v rootflags=x-systemd.device-timeout=90s rw systemd.gpt_auto=0 panic=10 systemd.watchdog_sec=30
                  console=ttyS0,115200 console=tty0
Packages=
        linux-image-generic
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        systemd-container
        systemd-resolved
        systemd-timesyncd
        udev
        dbus
        openssh-server
        sudo
        e2fsprogs
        dosfstools
        efibootmgr
        iproute2
        iputils-ping
        curl
        ca-certificates
        zstd
        less
        nano
