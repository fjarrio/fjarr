# Fjarr development stack. See docs/12-development-environment.md.
#
# Profiles:
#   (default)  dev + robot-sim
#   demo       the three-demo showcase: fjarr-server sidecar + TS demo-backend
#              + demo-robot + demo-dashboard (customer deployment topology)
#   turn       coturn relay in use-auth-secret mode
#   lab        headless Chromium with CDP for the browser lab (docs/25)
#
# Overrides (conscious privilege grants, opt in explicitly):
#   docker-compose.host-x11.yml   capture your real host desktop
#   docker-compose.uinput.yml     /dev/uinput injection experiments
# Standing grants (dev-only, docs/12):
#   `dev` mounts the host docker socket so the browser lab can drive this stack from inside
#   (netem, pause, restart). `make doctor` checks that DOCKER_GID in .env matches its group.
#   `dev` and `demo-robot` get /dev/net/tun and NET_ADMIN so `make tun-up` can create the tunnel
#   interfaces the installer creates on a real robot (docs/27). Neither the agent nor fjarr-opsim
#   uses the capability — they attach to a device someone else made, which is the whole point of
#   the persistent-interface design.
name: fjarr

services:
  dev:
    build:
      context: .devcontainer
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        RENDER_GID: ${RENDER_GID:-110}
        VIDEO_GID: ${VIDEO_GID:-44}
        DOCKER_GID: ${DOCKER_GID:-999}
    image: fjarr-dev
    volumes:
      - .:/workspace:cached
      - x11sock:/tmp/.X11-unix
      # docker-outside-of-docker: the browser lab drives the stack from dev
      # (netem on demo-robot, fault switches) — docs/25.
      - /var/run/docker.sock:/var/run/docker.sock
      - cargo-registry:/home/dev/.cargo/registry
      - pnpm-store:/home/dev/.local/share/pnpm
      - ccache:/home/dev/.cache/ccache
      # The lab's throwaway ssh key, published by robot-services (docs/27 gate: ssh and scp).
      - lab-key:/srv/fjarr-lab-key
    environment:
      DISPLAY: ":99" # the robot-sim display
      CCACHE_DIR: /home/dev/.cache/ccache
    devices:
      - /dev/dri:/dev/dri # Intel VA-API; comment out on machines without a GPU
      # The operator end of the tunnel lab (docs/27): `make tun-up` creates fjarr0 here the way
      # the installer creates it on a robot, and fjarr-opsim attaches to it. dev must be in its
      # own network namespace for this to mean anything — opsim's other scenarios share the
      # robot's, where both tunnel addresses would be local and the kernel would short-circuit.
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN # creating the lab's tunnel interface; the agent and opsim need none of it
    networks:
      default:
        # The lab browser loads pages served from here (docs/25). Not "dev":
        # Chrome's HSTS preload list forces https on that name.
        aliases: [lab-host]
    working_dir: /workspace
    command: sleep infinity

  robot-sim:
    build: docker/robot-sim
    image: fjarr-robot-sim
    environment:
      SIM_RESOLUTION: ${SIM_RESOLUTION:-1920x1080x24}
    volumes:
      - x11sock:/tmp/.X11-unix
    ports:
      - "6080:6080" # noVNC: watch the fake robot desktop in a browser

  # ---------------------------------------------------------------- demo --
  # The customer deployment topology: their backend (TS) + our sidecar.
  fjarr-server:
    profiles: [demo, stack]
    build:
      context: signaling
      dockerfile: ../docker/signaling/Dockerfile
    image: fjarr-server
    ports:
      - "8080:8080"
    environment:
      # docs/09 contract surface; values from .env (never committed).
      FJARR_GRANT_HS256_SECRET: ${FJARR_GRANT_HS256_SECRET:-dev-only-grant-secret}
      FJARR_DEV_DEVICE_TOKEN: ${FJARR_DEV_DEVICE_TOKEN:-dev-only-device-token}
      FJARR_TURN_URLS: ${FJARR_TURN_URLS:-}
      FJARR_TURN_SECRET: ${TURN_SECRET:-dev-only-change-me} # matches coturn's default, so the lab needs no .env
      # docs/09#b-webhooks. Empty by default: the `stack` profile runs fjarr-server
      # without demo-backend, and delivering to nothing would retry three times per
      # event. `make demo-up` sets it, which is where a receiver actually exists.
      FJARR_WEBHOOK_URL: ${FJARR_WEBHOOK_URL:-}
      FJARR_WEBHOOK_SECRET: ${FJARR_WEBHOOK_SECRET:-dev-only-webhook-secret}

  demo-backend:
    profiles: [demo]
    image: node:22-slim
    volumes:
      - ./demos/demo-backend:/app:cached
    working_dir: /app
    environment:
      FJARR_SERVER_URL: http://fjarr-server:8080
      PORT: "9090"
      FJARR_GRANT_HS256_SECRET: ${FJARR_GRANT_HS256_SECRET:-dev-only-grant-secret}
      FJARR_WEBHOOK_SECRET: ${FJARR_WEBHOOK_SECRET:-dev-only-webhook-secret}
    command: node --experimental-strip-types src/server.ts
    ports:
      - "9090:9090"
    depends_on:
      - fjarr-server

  demo-robot:
    profiles: [demo]
    image: fjarr-dev
    volumes:
      - .:/workspace:cached
      - x11sock:/tmp/.X11-unix
      # The viewer's build output (`make web-build`) where the fjarr-agent package will install it (docs/24, docs/26).
      - ./web/apps/introspect-viewer/dist:/usr/share/fjarr/viewer:ro
    environment:
      DISPLAY: ":99"
      FJARR_SERVER_URL: ws://fjarr-server:8080/ws
      FJARR_ROBOT_ID: demo-robot-01
      FJARR_DEV_DEVICE_TOKEN: ${FJARR_DEV_DEVICE_TOKEN:-dev-only-device-token}
      # The demo drives fjarr.test's hooks (hot-plug, silence); a container has no systemd.
      FJARR_TEST_HOOKS: "1"
      FJARR_AGENT_ALLOW_UNSUPERVISED: "1"
      # auto = VA-API through /dev/dri (docs/23 encoder policy); set software on machines without a GPU.
      FJARR_MEDIA_ENCODER: ${FJARR_MEDIA_ENCODER:-auto}
      FJARR_LOG_LEVEL: ${FJARR_LOG_LEVEL:-info}
      # `make agent-leaks` recreates the robot with GStreamer's leaks tracer (docs/23 memory ladder).
      GST_TRACERS: ${FJARR_GST_TRACERS:-}
      # For looking inside the transport when the tunnel misbehaves (open question #28):
      # FJARR_GST_DEBUG='sctp*:6,dtls*:5' docker compose up -d demo-robot
      GST_DEBUG: ${FJARR_GST_DEBUG:-}
      # The introspection endpoint (docs/24) is loopback-only by default; the demo binds it on the
      # container's interface with a dev token so `make introspect` and the lab browser reach the
      # viewer at http://localhost:7381/ (published on the host's loopback only, below).
      FJARR_INTROSPECT_BIND: "0.0.0.0"
      FJARR_INTROSPECT_TOKEN: ${FJARR_INTROSPECT_TOKEN:-dev-only-introspect-token}
      FJARR_INTROSPECT_VIEWER_DIR: /usr/share/fjarr/viewer
      # fjarr.net (docs/27): on only once `make tun-up` has created the interface, which is the
      # real ordering too — the device exists before the agent starts, never the other way round.
      FJARR_DEMO_NET: ${FJARR_DEMO_NET:-0}
    ports:
      - "127.0.0.1:7381:7381"
    working_dir: /workspace
    cap_add:
      - NET_ADMIN   # tc netem for the browser lab's media-path profiles (docs/25); the tunnel
                    # interface (docs/27) — used by `make tun-up`, never by the agent itself
    devices:
      - /dev/dri:/dev/dri
      - /dev/net/tun:/dev/net/tun # the robot end of the tunnel lab (docs/27)
    command: >
      bash -c "test -x ./build/release/demos/demo-robot/demo-robot
      || { echo 'demo-robot not built yet — run: make agent-build'; sleep infinity; };
      if [ \"$$FJARR_DEMO_NET\" = 1 ]; then
      echo 'waiting for the tunnel interface before starting the agent (docs/27#lifecycle: the device exists first, always)';
      for i in $$(seq 20); do ip link show $${FJARR_DEMO_NET_INTERFACE:-fjarr0} >/dev/null 2>&1 && break; sleep 1; done;
      ip link show $${FJARR_DEMO_NET_INTERFACE:-fjarr0} >/dev/null 2>&1
      || echo 'no tunnel interface after 20 s — starting anyway, with fjarr.net unavailable. A container restart takes its
      network namespace with it, which a real robot does not do; run `make tun-up` again.'; fi;
      exec ./build/release/demos/demo-robot/demo-robot"
    depends_on:
      - robot-sim
      - fjarr-server
      - rtsp-sim

  # A second robot, so 4.5e can prove that robot A cannot reach robot B (docs/15 safety class). It
  # is a plain second agent with its own id: the isolation property is the operator's to enforce,
  # and nothing here is special-cased for it.
  demo-robot-2:
    profiles: [demo]
    image: fjarr-dev
    volumes:
      - .:/workspace:cached
      - x11sock:/tmp/.X11-unix
      # The viewer's build output (`make web-build`) where the fjarr-agent package will install it (docs/24, docs/26).
      - ./web/apps/introspect-viewer/dist:/usr/share/fjarr/viewer:ro
    environment:
      DISPLAY: ":99"
      FJARR_SERVER_URL: ws://fjarr-server:8080/ws
      FJARR_ROBOT_ID: demo-robot-02
      FJARR_DEV_DEVICE_TOKEN: ${FJARR_DEV_DEVICE_TOKEN:-dev-only-device-token}
      # The demo drives fjarr.test's hooks (hot-plug, silence); a container has no systemd.
      FJARR_TEST_HOOKS: "1"
      FJARR_AGENT_ALLOW_UNSUPERVISED: "1"
      # auto = VA-API through /dev/dri (docs/23 encoder policy); set software on machines without a GPU.
      FJARR_MEDIA_ENCODER: ${FJARR_MEDIA_ENCODER:-auto}
      FJARR_LOG_LEVEL: ${FJARR_LOG_LEVEL:-info}
      # `make agent-leaks` recreates the robot with GStreamer's leaks tracer (docs/23 memory ladder).
      GST_TRACERS: ${FJARR_GST_TRACERS:-}
      # The introspection endpoint (docs/24) is loopback-only by default; the demo binds it on the
      # container's interface with a dev token so `make introspect` and the lab browser reach the
      # viewer at http://localhost:7381/ (published on the host's loopback only, below).
      FJARR_INTROSPECT_BIND: "0.0.0.0"
      FJARR_INTROSPECT_TOKEN: ${FJARR_INTROSPECT_TOKEN:-dev-only-introspect-token}
      FJARR_INTROSPECT_VIEWER_DIR: /usr/share/fjarr/viewer
      # fjarr.net (docs/27): on only once `make tun-up` has created the interface, which is the
      # real ordering too — the device exists before the agent starts, never the other way round.
      FJARR_DEMO_NET: ${FJARR_DEMO_NET_2:-0}
    working_dir: /workspace
    cap_add:
      - NET_ADMIN   # tc netem for the browser lab's media-path profiles (docs/25); the tunnel
                    # interface (docs/27) — used by `make tun-up`, never by the agent itself
    devices:
      - /dev/dri:/dev/dri
      - /dev/net/tun:/dev/net/tun # the robot end of the tunnel lab (docs/27)
    command: >
      bash -c "test -x ./build/release/demos/demo-robot/demo-robot
      || { echo 'demo-robot not built yet — run: make agent-build'; sleep infinity; };
      if [ \"$$FJARR_DEMO_NET\" = 1 ]; then
      echo 'waiting for the tunnel interface before starting the agent (docs/27#lifecycle: the device exists first, always)';
      for i in $$(seq 20); do ip link show $${FJARR_DEMO_NET_INTERFACE_2:-fjarr0} >/dev/null 2>&1 && break; sleep 1; done;
      ip link show $${FJARR_DEMO_NET_INTERFACE:-fjarr0} >/dev/null 2>&1
      || echo 'no tunnel interface after 20 s — starting anyway, with fjarr.net unavailable. A container restart takes its
      network namespace with it, which a real robot does not do; run `make tun-up` again.'; fi;
      exec ./build/release/demos/demo-robot/demo-robot"
    depends_on:
      - robot-sim
      - fjarr-server
      - rtsp-sim

  # The services the tunnel exists to reach, on the robot's own network stack (docs/27). A sidecar
  # rather than part of the agent's image: on a real robot sshd is the integrator's package and the
  # agent never knows about it, and sharing the namespace is what puts it on the robot's tunnel
  # address. It has no network config of its own by design — `network_mode: service:` forbids it.
  robot-services:
    profiles: [demo]
    build: docker/robot-services
    image: fjarr-robot-services
    network_mode: "service:demo-robot"
    environment:
      FJARR_LAB_FILE_MB: ${FJARR_LAB_FILE_MB:-1024}
      # ssh refuses a private key others can read, so it is published to the operator's uid.
      FJARR_LAB_KEY_UID: ${USER_UID:-1000}
      FJARR_LAB_KEY_GID: ${USER_GID:-1000}
    volumes:
      - lab-key:/srv/fjarr-lab-key
    depends_on:
      - demo-robot

  # ROS 2 on each end of the link, in sidecars sharing the namespace that owns the tunnel device
  # (docs/27#ros2). Separate containers for the same reason sshd is one: on a robot, ROS 2 is the
  # customer's software and `fjarr-agent` neither contains nor knows about it — and DDS binds its
  # interfaces at participant creation, so what matters is only that these see `fjarr0`.
  # `ros:jazzy-ros-base` is the image the spike measured (agent/spikes/ros2-tunnel).
  robot-ros:
    profiles: [ros]
    image: ros:jazzy-ros-base
    network_mode: "service:demo-robot"
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    volumes:
      - ./docker/lab:/lab:ro
    command: ["bash", "/lab/ros-robot.sh"]
    depends_on:
      - demo-robot

  operator-ros:
    profiles: [ros]
    image: ros:jazzy-ros-base
    network_mode: "service:dev"
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    volumes:
      - ./docker/lab:/lab:ro
    command: ["bash", "/lab/ros-operator.sh"]
    depends_on:
      - dev

  rtsp-sim:
    # A network camera stand-in for fjarr.camera's `rtsp` track (docs/06, slice 4): GStreamer's
    # RTSP server serving a test pattern as H.264 at rtsp://rtsp-sim:8554/pattern.
    profiles: [demo]
    image: fjarr-dev
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    command: python3 docker/lab/rtsp-sim.py
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8554), timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  demo-dashboard:
    profiles: [demo]
    image: fjarr-dev
    volumes:
      - .:/workspace:cached
      - pnpm-store:/home/dev/.local/share/pnpm
    working_dir: /workspace
    command: >
      bash -c "corepack enable && pnpm install
      && pnpm --filter fjarr-demo-dashboard dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - demo-backend

  # ----------------------------------------------------------------- lab --
  # The browser lab (docs/25): one headless Chromium with the DevTools
  # protocol exposed, fake media devices, driven over CDP from `dev`
  # (@fjarr/e2e, fjarr-lab) and observable from the host at :9222/json.
  # Image tag = the @playwright/test version pinned in web/e2e/package.json.
  browser:
    profiles: [lab]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    init: true
    shm_size: 1g
    environment:
      LAB_CHROMIUM_FLAGS: ${LAB_CHROMIUM_FLAGS:-}
      # Origins treated as secure contexts (getUserMedia): see docker/lab/run-chromium.sh
      LAB_INSECURE_ORIGINS: ${LAB_INSECURE_ORIGINS:-}
    volumes:
      - ./docker/lab/run-chromium.sh:/usr/local/bin/run-chromium:ro
    command: ["run-chromium"]
    ports:
      - "127.0.0.1:9222:9222" # a browser with --no-sandbox and open CDP: never on a LAN interface
    extra_hosts:
      - "host.docker.internal:host-gateway" # CI serves the lab pages from the runner
    healthcheck:
      # Through the container's own address: proves the network-facing path, not loopback.
      test: ["CMD-SHELL", "curl -fsS http://$$(hostname -i):9222/json/version >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---------------------------------------------------------------- turn --
  coturn:
    # Every profile that runs fjarr-server runs coturn, because the sidecar mints TURN
    # credentials from `.env` and credentials pointing at a server that is not there are
    # worse than none: ICE waits on it. `lab` needs it for the latency harness's relay
    # column (docs/25, docs/16); `demo` because a customer's topology has a relay.
    profiles: [turn, lab, demo, stack]
    image: coturn/coturn:4.6-alpine
    # use-auth-secret from day one: ephemeral HMAC credentials only, never
    # static passwords (teleop-car lesson — docs/10-security.md).
    command: >
      --listening-port=3478
      --realm=${TURN_REALM:-fjarr.local}
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET:-dev-only-change-me}
      --min-port=49160 --max-port=49200
      --fingerprint
      --no-cli
      --verbose
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

volumes:
  lab-key: # the lab's throwaway ssh key, robot-services -> dev (docs/27)
  x11sock:
  cargo-registry:
  pnpm-store:
  ccache:
