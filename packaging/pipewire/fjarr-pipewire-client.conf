# The PipeWire client configuration of Fjarr's desktop module (fjarr-desktop-wayland; docs/23#desktop-
# descriptor-handover). Only what a capture stream needs, so the module does not depend on
# pipewire-bin's client.conf: that package brings GPL readline, which a shipped image may not carry
# (ADR-0011), and an image installed without recommends has no client.conf at all (compose gate,
# 2026-10-06). The modules are libpipewire-0.3-modules' (MIT).
context.properties = {
    log.level = 0
}
context.spa-libs = {
    support.*       = support/libspa-support
    video.convert.* = videoconvert/libspa-videoconvert
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
]
