# The unattended-access test, first half (docs/15#unattended-access-test-the-industrial-gate): install
# the packages of main's newest green CI run on the desktop lab machine (docs/30#artifacts-built-once),
# `setup desktop`, reboot. lab-desktop-verify checks it at 00:45.
# Lab machines serve only schedule and workflow_dispatch from main (ADR-0033, docs/12): never push or
# pull_request. A daytime dispatch waits in GitHub's queue until fjarr-lab opens the window (00:00).
name: Lab desktop — prepare

on:
  schedule:
    - cron: "15 22 * * *"   # 00:15 in Sweden (CEST); GitHub's cron is UTC
  workflow_dispatch:

concurrency:
  group: lab-desktop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # The packages are CI's, not rebuilt: the lab installs what CI tested. Only the lab's own binaries
    # (fjarr-server, fjarr-opsim) are built here, from the same commit.
    name: CI's packages + build fjarr-server, fjarr-opsim
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # the CI run's artifacts
      packages: write # the deb builder by content hash (docs/30#ci-images)
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
    env:
      FJARR_CI_PUSH: "1"
    steps:
      - uses: actions/checkout@v4
      - name: main's newest green CI run that built packages
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(bash tools/ci/ci-run.sh --latest-main)
          read -r run sha <<<"$found"
          echo "run=$run" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "testing $sha, CI run https://github.com/$GITHUB_REPOSITORY/actions/runs/$run"
      # The commit under test beside this workflow's own: the lookup above is this commit's tooling,
      # the build below is the tested commit's. When they were one checkout, a tested commit older
      # than tools/ci had no image.py and the night failed (2026-10-03).
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ci.outputs.sha }}
          path: under-test
      - uses: actions/download-artifact@v4
        with:
          name: debs-amd64
          path: under-test/dist/deb/amd64
          run-id: ${{ steps.ci.outputs.run }}
          github-token: ${{ github.token }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: the deb builder by content hash, when the commit under test has the tool (docs/30#ci-images)
        working-directory: under-test
        run: |
          if [ -f tools/ci/image.py ]; then
            python3 tools/ci/image.py build fjarr-deb-builder docker/deb-builder
            echo "DEB_BUILDER=prebuilt" >> "$GITHUB_ENV"
          fi
      - run: make lab-artifacts
        working-directory: under-test
      - uses: actions/upload-artifact@v4
        with:
          name: lab-desktop-build
          path: |
            under-test/dist/deb/amd64/fjarr-agent_*.deb
            under-test/dist/deb/amd64/fjarr-tools_*.deb
            under-test/dist/deb/amd64/fjarr-desktop-wayland_*.deb
            under-test/dist/lab/fjarr-server
            under-test/dist/lab/fjarr-opsim
          retention-days: 3

  prepare:
    name: install, setup desktop, reboot (mini-PC)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, fjarr-lab, desktop, gnome]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }} # the scripts of the commit under test
      - uses: actions/download-artifact@v4
        with:
          name: lab-desktop-build
          path: build-under-test
      - name: prepare (ends by asking fjarr-lab to reboot once this job has finished)
        run: |
          mkdir -p build-under-test/flat
          find build-under-test -type f \( -name '*.deb' -o -name 'fjarr-server' -o -name 'fjarr-opsim' \) -exec cp {} build-under-test/flat/ \;
          chmod +x build-under-test/flat/fjarr-server build-under-test/flat/fjarr-opsim
          sudo -n tools/fjarr-lab/unattended.sh prepare build-under-test/flat
