# The unattended-access test, second half (docs/15#unattended-access-test-the-industrial-gate): the
# machine verifies itself at the first boot after lab-desktop-prepare (fjarr-lab-unattended.service);
# this reports its verdict. GitHub's schedule is not an order, so when the machine has not rebooted
# yet (or is still verifying) this dispatches itself again and ends as rescheduled — at most 5 times.
# Lab machines serve only schedule and workflow_dispatch from main (ADR-0033, docs/12).
name: Lab desktop — verify

on:
  schedule:
    - cron: "45 22 * * *"   # 00:45 in Sweden (CEST), 30 min after prepare
  workflow_dispatch:
    inputs:
      attempt:
        description: which attempt this is (re-dispatches count up to 5)
        default: "1"

concurrency:
  group: lab-desktop
  cancel-in-progress: false

permissions:
  actions: write   # to dispatch itself again when the machine has not rebooted yet
  contents: read

jobs:
  verify:
    name: unattended access after the reboot (mini-PC)
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, fjarr-lab, desktop, gnome]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: the machine's verdict
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ inputs.attempt || '1' }}
          REPO: ${{ github.repository }}
        run: |
          # Tonight's prepare first: the verdict on the machine counts only if it is for that run. When
          # a prepare failed before reaching the machine, its state is an older night's (2026-10-03).
          read -r prep status conclusion < <(python3 - "$REPO" <<'PY'
          import json, os, sys, urllib.request, datetime
          req = urllib.request.Request(
              f"https://api.github.com/repos/{sys.argv[1]}/actions/workflows/lab-desktop-prepare.yml/runs?branch=main&per_page=1",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          runs = json.load(urllib.request.urlopen(req, timeout=20))["workflow_runs"]
          if not runs:
              print("none none none"); sys.exit()
          r = runs[0]
          age = datetime.datetime.now(datetime.timezone.utc) - datetime.datetime.fromisoformat(r["created_at"].replace("Z", "+00:00"))
          print(r["id"], r["status"], (r["conclusion"] or "none") if age < datetime.timedelta(hours=12) else "stale")
          PY
          )
          echo "tonight's prepare: run $prep, $status, $conclusion"
          if [ -z "$prep" ]; then echo "::error::could not ask GitHub for tonight's prepare run"; exit 1; fi
          if [ "$conclusion" = stale ] || [ "$prep" = none ]; then echo "::error::no lab-desktop-prepare run in the last 12 hours"; exit 1; fi
          if [ "$status" = completed ] && [ "$conclusion" != success ]; then
            echo "::error::tonight's prepare (run $prep) ended $conclusion: https://github.com/$REPO/actions/runs/$prep"; exit 1
          fi
          rc=0
          if [ "$status" != completed ]; then rc=75; else sudo -n tools/fjarr-lab/unattended.sh report --prepare-run "$prep" || rc=$?; fi
          if [ "$rc" -ne 75 ]; then exit "$rc"; fi
          if [ "$ATTEMPT" -ge 5 ]; then
            echo "::error::the machine had still not rebooted and verified after $ATTEMPT attempts"
            exit 1
          fi
          next=$((ATTEMPT + 1))
          python3 - "$REPO" "$next" <<'PY'
          import json, os, sys, urllib.request
          repo, attempt = sys.argv[1], sys.argv[2]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/workflows/lab-desktop-verify.yml/dispatches",
              data=json.dumps({"ref": "main", "inputs": {"attempt": attempt}}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"},
              method="POST")
          urllib.request.urlopen(req, timeout=20)
          PY
          echo "::notice::not verified yet (attempt $ATTEMPT): dispatched attempt $next, which runs once the machine has rebooted"
