# Fjarr CI — the gates from docs/13-development-workflow.md.
# Website deployment is handled by Cloudflare Pages' Git integration
# (docs/19-website-and-publishing.md#deployment), not by CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    name: Docs gates + website build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "docs/**/*.md" "*.md"
      - name: link check (offline, incl. anchors)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments "docs/**/*.md" "*.md"
          fail: true
      - name: protocol conformance (golden fixtures)
        run: node protocol/check.mjs
      - name: build website
        run: pnpm --filter fjarr-website build

  web:
    name: Web packages + demos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@fjarr/core' --filter '@fjarr/react' build
      - run: pnpm --filter '@fjarr/core' --filter '@fjarr/react' typecheck
      - run: pnpm --filter '@fjarr/core' --filter '@fjarr/react' test
      - run: pnpm --filter fjarr-demo-dashboard build
      - run: pnpm --filter fjarr-demo-backend typecheck

  e2e:
    name: Browser lab + real agent (Chromium over CDP, fjarr-server, demo robot, opsim)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@fjarr/core' --filter '@fjarr/react' build
      - run: pnpm --filter '@fjarr/e2e' typecheck
      - name: start the lab browser, fjarr-server and the demo stack (docs/25 topology; the real agent on the software encoder)
        run: |
          cp .env.example .env
          # The dev image's user must own the checkout (the runner user is not uid 1000) and
          # share the docker socket's group, or nothing inside the container can build or exec.
          sed -i "s/^USER_UID=.*/USER_UID=$(id -u)/; s/^USER_GID=.*/USER_GID=$(id -g)/; s#^DOCKER_GID=.*#DOCKER_GID=$(stat -c %g /var/run/docker.sock)#" .env
          grep -E "^(USER_UID|USER_GID|DOCKER_GID)=" .env
          # dev and demo-robot map /dev/dri (VA-API); a hosted runner has none. An empty
          # directory maps no device and the demo robot stays on the software encoder.
          sudo mkdir -p /dev/dri
          docker compose --profile lab --profile stack up -d --build --wait browser fjarr-server
          docker compose build dev
          docker compose up -d dev
          docker compose exec -T dev make agent-build
          FJARR_MEDIA_ENCODER=software docker compose --profile demo --profile stack up -d demo-backend demo-robot demo-dashboard
          sleep 8 && docker compose logs --no-color demo-robot | tail -20
      - name: run the e2e suites (loopback + stack)
        env:
          # The runner serves the lab page; the browser container reaches it via host-gateway.
          E2E_BROWSER: http://localhost:9222
          E2E_PAGE_ORIGIN: http://host.docker.internal:5174
          E2E_SERVER_WS: ws://fjarr-server:8080/ws
          E2E_SERVER_HTTP: http://localhost:8080
          E2E_DASHBOARD_HTTP: http://localhost:5173
          E2E_INTROSPECT_HTTP: http://localhost:7381
          E2E_VIEWER_URL: http://demo-robot:7381/
          CI: "true"
        # pnpm 10 forwards `--` literally: call playwright through `exec` to pass flags
        run: pnpm --filter '@fjarr/e2e' exec playwright test --project loopback --project stack
      - name: unit + loop tests under ThreadSanitizer (a gate, docs/15; runner-level because of the sysctl)
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28   # TSan's shadow layout vs 32-bit ASLR entropy (docs/12)
          docker compose exec -T dev make agent-test-tsan
      - name: fjarr-opsim scenarios against the demo robot (docs/23 gate 2)
        # From the runner: the target execs into the demo robot's container itself.
        run: make opsim-all
      - name: "20-cycle soak (docs/15: the census returns to baseline every commit; 200 nightly)"
        run: make opsim-soak OPSIM_CYCLES=20
      - name: the fjarr-agent image (docs/12, slice 5b — built and smoke-tested every push, published in M2.5)
        env:
          E2E_BROWSER: http://localhost:9222
          E2E_PAGE_ORIGIN: http://host.docker.internal:5174
          E2E_SERVER_WS: ws://fjarr-server:8080/ws
          E2E_SERVER_HTTP: http://localhost:8080
          E2E_DASHBOARD_HTTP: http://localhost:5173
          E2E_INTROSPECT_HTTP: http://localhost:7381
          E2E_VIEWER_URL: http://demo-robot:7381/
          CI: "true"
        run: |
          docker build -f docker/agent/Dockerfile --target runtime -t fjarr-agent .
          docker run --rm --entrypoint sh fjarr-agent -c '! gst-inspect-1.0 x264enc >/dev/null 2>&1 && fjarr-agent --help | grep -q ^fjarr-agent && ! ldd /usr/local/bin/fjarr-agent | grep -q "not found"'
          # The demo robot from the image (the embedder's topology): the same lab smoke as the dev-image robot.
          FJARR_MEDIA_ENCODER=software docker compose -f docker-compose.yml -f docker-compose.image.yml --profile demo up -d --build demo-robot
          sleep 8 && docker compose logs --no-color demo-robot | tail -20
          pnpm --filter '@fjarr/e2e' exec playwright test tests/stack/viewer.spec.ts tests/stack/introspect.spec.ts tests/stack/dashboard.spec.ts
      - name: lab artifacts (summaries, captures, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-lab
          path: |
            web/e2e/out/**/summary.*
            web/e2e/out/**/*.jsonl
            web/e2e/out/test-results/**
          if-no-files-found: ignore
      - name: stack logs on failure
        if: failure()
        run: docker compose --profile lab --profile stack --profile demo logs --no-color --tail 200 browser fjarr-server demo-robot demo-backend

  rust:
    name: Signaling (test + clippy + fmt)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: signaling
    steps:
      - uses: actions/checkout@v4
      # rustup reads signaling/rust-toolchain.toml automatically
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: signaling
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  cpp:
    name: Agent + demo-robot build (Ubuntu 26.04 / GStreamer 1.28)
    runs-on: ubuntu-24.04
    # The baseline (ADR-0022) is newer than the hosted runner: build inside
    # the baseline image so the toolchain matches the dev container.
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - name: install build deps (mirror of .devcontainer/Dockerfile groups)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates build-essential cmake ninja-build ccache pkg-config make \
            clang-21 libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-nice nlohmann-json3-dev libtomlplusplus-dev \
            libsoup-3.0-dev libsystemd-dev libgtest-dev
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: cpp-${{ runner.os }}
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: ctest --preset release --output-on-failure
      - name: RAII kit gate (docs/23 memory ladder)
        run: make agent-raii-gate
      - name: the leaks-tracer bracketing catches a deliberate leak (docs/23 ladder layer 3)
        run: make agent-leaks-selftest
      - name: unit + loop tests under ASan/UBSan/LSan (a gate, docs/15)
        run: |
          cmake --preset asan
          cmake --build --preset asan
          ctest --preset asan --output-on-failure
      # ADR-0011 license policy is enforced structurally too:
      - name: assert no GPL plugin package in the dependency docs
        run: "! grep -i 'plugins-ugly' CMakeLists.txt agent/CMakeLists.txt"

  server-image:
    name: fjarr-server production image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build standalone from signaling/ only
        run: docker build -f docker/signaling/Dockerfile signaling/
