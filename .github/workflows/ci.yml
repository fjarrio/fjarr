# Fjarr CI — the gates from docs/13-development-workflow.md, laid out per
# docs/30-continuous-integration.md (the job graph, which changes run what, CI images, caches):
# read it before adding a job, a cache or an image here.
# Website deployment is handled by Cloudflare Pages' Git integration
# (docs/19-website-and-publishing.md#deployment), not by CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every commit on main keeps its own run (docs/30#principles: bisecting and tagging need each
# verdict); a new push to a pull request cancels that PR's older run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # CI images built here are pushed only from main (docs/30#ci-images); a pull request only pulls.
  FJARR_CI_PUSH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '1' || '0' }}

jobs:
  changes:
    # docs/30#which-changes-run-what: code=false only when every changed file is on the docs list.
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - name: tools/ci's own tests (the classifier below, the CI images' hash)
        run: make ci-test
      - id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          bash tools/ci/changes.sh "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"

  docs:
    name: Docs gates + website build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "docs/**/*.md" "*.md"
      - name: link check (offline, incl. anchors)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments "docs/**/*.md" "*.md"
          fail: true
      - name: protocol conformance (golden fixtures)
        run: node protocol/check.mjs
      - name: build website
        run: pnpm --filter fjarr-website build
      # After the build, because it checks both halves: that every diagram parses, and that the
      # built page still carries the author's source. The bug it was written for was silent — a
      # diagram that parses perfectly became "Syntax error in text" on the site, because the source
      # was scraped back out of highlighted markup and lost every line break (docs/19#diagrams).
      - name: mermaid diagrams (parse + present in the built site)
        run: pnpm --filter fjarr-website run check:mermaid

  web:
    name: Web packages + demos
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@fjarr/core' --filter '@fjarr/react' build
      - run: pnpm --filter '@fjarr/core' --filter '@fjarr/react' typecheck
      - run: pnpm --filter '@fjarr/core' --filter '@fjarr/react' test
      - run: pnpm --filter fjarr-demo-dashboard build
      - run: pnpm --filter fjarr-demo-backend typecheck

  e2e:
    name: Browser lab + real agent (Chromium over CDP, fjarr-server, demo robot, opsim)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      packages: write # the CI images (docs/30#ci-images)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The viewer's build output is served by the robot (docs/24); the dashboard imports @fjarr/* from dist.
      - run: pnpm -r --filter '@fjarr/introspect-viewer...' --filter 'fjarr-demo-dashboard^...' build
      - run: pnpm --filter '@fjarr/e2e' typecheck
      - name: the runner's .env (uid, groups, the software encoder)
        run: bash tools/ci/runner-env.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: CI images by content hash (docs/30#ci-images)
        run: python3 tools/ci/image.py compose dev robot-sim fjarr-server desktop-fixture robot-services x11-fixture
      - uses: actions/cache/restore@v4
        with:
          path: build/ccache-dev
          key: ccache-dev-release-${{ github.run_id }}
          restore-keys: ccache-dev-release-
      - name: start the lab browser, fjarr-server and the demo stack (docs/25 topology; the real agent on the software encoder)
        run: |
          # TURN, the webhook URL and the encoder all come from .env (runner-env.sh), never from
          # a `docker compose up` line: a later `up` re-resolves a service's environment, so
          # anything passed inline is silently lost the next time that service is recreated.
          # That is how TURN and the webhook broke the first time, and how the encoder broke the
          # first time `make tun-up` recreated the robot.
          docker compose --profile lab --profile stack up -d --build --wait browser fjarr-server coturn
          docker compose up -d dev
          docker compose exec -T -e CCACHE_DIR=/workspace/build/ccache-dev -e CCACHE_MAXSIZE=500M dev sh -c 'make agent-build && ccache -s'
          docker compose --profile demo --profile stack up -d demo-backend demo-robot demo-dashboard
          sleep 8 && docker compose logs --no-color demo-robot | tail -20
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && env.FJARR_CI_PUSH == '1' }}
        with:
          path: build/ccache-dev
          key: ccache-dev-release-${{ github.run_id }}
      - name: run the e2e suites (loopback + stack)
        env:
          # The runner serves the lab page; the browser container reaches it via host-gateway.
          E2E_BROWSER: http://localhost:9222
          E2E_PAGE_ORIGIN: http://host.docker.internal:5174
          E2E_SERVER_WS: ws://fjarr-server:8080/ws
          E2E_SERVER_HTTP: http://localhost:8080
          E2E_DASHBOARD_HTTP: http://localhost:5173
          # the harness runs on the runner host here, so compose service names do not resolve
          E2E_BACKEND_HTTP: http://localhost:9090
          E2E_INTROSPECT_HTTP: http://localhost:7381
          E2E_VIEWER_URL: http://demo-robot:7381/
          CI: "true"
        # pnpm 10 forwards `--` literally: call playwright through `exec` to pass flags.
        # A missing precondition fails in CI rather than skipping (needs(), docs/30#principles), so the
        # tests that need what only a later step brings up are left to that step: the 4.5f login gate
        # (fjarr-connect and the tunnel, `make tunnel-login`) and the Desktop panel (the fixture,
        # `make desktop-browser`).
        run: pnpm --filter '@fjarr/e2e' exec playwright test --project loopback --project stack --grep-invert "4\\.5f gate|Desktop panel"
      - name: fjarr-opsim scenarios against the demo robot (docs/23 gate 2)
        # From the runner: the target execs into the demo robot's container itself.
        run: make opsim-all
      - name: the robot's desktop as a track (M3 3.1, docs/15#the-desktop-test-lab)
        # The desktop fixture's GNOME session → fjarr-desktop-session → backend module E → the agent
        # → opsim decodes frames, including from a still screen (the keepalive).
        run: make desktop-e2e
      - name: the Desktop panel in the lab browser, against the fixture's desktop (M3 3.1, 3.2, 3.4)
        # From dev: the fixture and the desktop robot are compose names the runner cannot resolve, which
        # is why these three tests had been skipping in every run until 2026-10-02 (docs/30). The target
        # fails when any of them skips.
        run: make desktop-browser
      - name: an X11 kiosk robot (M3 3.7, docs/15#the-desktop-test-lab)
        # robot-sim in fixture mode (access control on, the agent's account granted, a wide root carved
        # into RandR monitors) → backend A in the agent's own process → opsim: see, drive, hot-plug, cursor.
        run: make x11-e2e
      - name: "20-cycle soak (docs/15: the census returns to baseline every commit; 200 nightly)"
        run: make opsim-soak OPSIM_CYCLES=20
      - name: "the robot logged no criticals (docs/15; the gate's selftest proves it can fire)"
        # After the suites, not before: this asks whether anything they did made the agent log a
        # critical. A GLib critical means a refcount or assertion was already violated, and the
        # tests can still pass around it — which is exactly how a double-released fd watch rode
        # along in this job's logs for weeks (cd81195, slice 4.5b).
        run: |
          make agent-log-gate-selftest
          make agent-log-gate
      - name: the network tunnel end to end (docs/27 gate, slice 4.5a)
        # tun-up plays the installer: it creates the interfaces and restarts the robot with
        # fjarr.net on, so the device exists before the agent does — the ordering the design
        # rests on. The scenario then carries real IP over a real data channel.
        # The login gate is a browser suite that runs while the tunnel is still up, so this step
        # carries the same lab environment the browser-suite steps do: without it the suite's
        # compose-network defaults (`browser:9222`) cannot resolve on the runner.
        env:
          E2E_BROWSER: http://localhost:9222
          E2E_PAGE_ORIGIN: http://host.docker.internal:5174
          E2E_SERVER_WS: ws://fjarr-server:8080/ws
          E2E_SERVER_HTTP: http://localhost:8080
          E2E_DASHBOARD_HTTP: http://localhost:5173
          E2E_INTROSPECT_HTTP: http://localhost:7381
          CI: "true"
        run: |
          make tun-up LAB_FILE_MB=64
          make opsim-tunnel
          # The shell over the link is asserted: it is reliable (docs/27, slice 4.5c).
          make tunnel-ssh
          # 4.5f: login through the dashboard in the lab browser, list, pick by label, connect, and the
          # session in the audit log with fjarr.net among its capabilities (docs/27#logging-in).
          make tunnel-login
          # Asserted since ADR-0027: at an MTU of one SCTP chunk the transfer went 20 of 20 where it
          # had been red in half of runs for three slices (open question #28, closed).
          make tunnel-scp
      - name: the robot's side of a failed tunnel step (open question #39)
        # The job's final log dump comes after later steps, which push these lines out of it. #39:
        # the agent dropped off the server ~10 s after tun-up's restart, and opsim's hello landed in
        # the gap; the supervisor's exit line says why the agent went.
        if: failure()
        run: |
          docker compose logs --no-color --since 15m demo-robot | grep -E "agent exited|waiting for the tunnel|no tunnel interface|core started|hello-ack|signaling (error|closed|disconnected)|ERROR|fatal" || true
          docker compose logs --no-color --since 15m fjarr-server | grep -E "demo-robot-01" || true
      - name: tunnel interfaces down
        if: always()
        run: make tun-down
      - name: lab artifacts (summaries, captures, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-lab
          path: |
            web/e2e/out/**/summary.*
            web/e2e/out/**/*.jsonl
            web/e2e/out/test-results/**
          if-no-files-found: ignore
      - name: stack logs on failure
        if: failure()
        run: docker compose --profile lab --profile stack --profile demo logs --no-color --tail 200 browser fjarr-server demo-robot demo-backend demo-dashboard

  agent-image:
    # The runtime image from the .debs the packages job built (docs/30#artifacts-built-once), the demo
    # robot from it with the lab browser's smoke suites, and the reference compose file.
    name: fjarr-agent image from the packages + the reference compose file
    runs-on: ubuntu-24.04
    needs: [changes, packages]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      packages: write # the CI images (docs/30#ci-images)
    env:
      E2E_BROWSER: http://localhost:9222
      E2E_PAGE_ORIGIN: http://host.docker.internal:5174
      E2E_SERVER_WS: ws://fjarr-server:8080/ws
      E2E_SERVER_HTTP: http://localhost:8080
      E2E_DASHBOARD_HTTP: http://localhost:5173
      E2E_BACKEND_HTTP: http://localhost:9090
      E2E_INTROSPECT_HTTP: http://localhost:7381
      E2E_VIEWER_URL: http://demo-robot:7381/
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The viewer's build output is served by the robot (docs/24); the dashboard imports @fjarr/* from dist.
      - run: pnpm -r --filter '@fjarr/introspect-viewer...' --filter 'fjarr-demo-dashboard^...' build
      - name: the runner's .env (uid, groups, the software encoder)
        run: bash tools/ci/runner-env.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: CI images by content hash (docs/30#ci-images)
        run: python3 tools/ci/image.py compose dev robot-sim fjarr-server
      - uses: actions/download-artifact@v4
        with:
          name: debs-amd64
          path: dist/deb/amd64
      - uses: actions/cache/restore@v4
        with:
          path: build/ccache-dev
          key: ccache-dev-release-${{ github.run_id }}
          restore-keys: ccache-dev-release-
      - name: the lab stack, and fjarr-opsim for the compose file's tunnel scenario
        run: |
          docker compose --profile lab --profile stack up -d --wait browser fjarr-server coturn
          docker compose up -d dev
          docker compose exec -T -e CCACHE_DIR=/workspace/build/ccache-dev -e CCACHE_MAXSIZE=500M dev \
            sh -c 'cmake --preset release >/dev/null && cmake --build --preset release --target fjarr-opsim'
          docker compose --profile demo --profile stack up -d demo-backend demo-dashboard
      - name: the fjarr-agent image (docs/12, slice 5b — built and smoke-tested every push, published in M2.5)
        run: |
          # Built FROM the packages job's .debs (docs/26#releases, ADR-0031), not a rebuild of them.
          docker build -f docker/agent/Dockerfile --target runtime -t fjarr-agent .
          docker run --rm --entrypoint sh fjarr-agent -c '! gst-inspect-1.0 x264enc >/dev/null 2>&1 && (fjarr-agent --help 2>&1 | grep -q ^fjarr-agent) && ! ldd /usr/bin/fjarr-agent | grep -q "not found" && id -u | grep -qx 10001'
          # The demo robot from the image (the embedder's topology): the same lab smoke as the dev-image robot.
          docker compose -f docker-compose.yml -f build/ci/compose.images.yml -f docker-compose.image.yml --profile demo up -d --build demo-robot
          sleep 8 && docker compose logs --no-color demo-robot | tail -20
          # The Desktop panel needs the desktop fixture, which this job does not run (e2e's desktop-browser does).
          pnpm --filter '@fjarr/e2e' exec playwright test tests/stack/viewer.spec.ts tests/stack/introspect.spec.ts tests/stack/dashboard.spec.ts --grep-invert "Desktop panel"
      - name: the reference compose file (docs/26#containerized-robots, M2.5 gate)
        # Exactly as shipped, host networking included: this runner is thrown away, so fjarr0 in its
        # namespace harms nothing (a workstation runs the gate in a sandbox namespace instead).
        # Setup in the image, a ROS container that waits for carrier, an agent with no privileges,
        # a restart the device survives, and the tunnel scenario from an operator. Uses the
        # packages job's .debs, like the image step.
        env:
          FJARR_GATE_SANDBOX: "0"
        # The lab robot publishes its introspection on the host's 7381, which is where a host-network
        # agent listens too (and where the tunnel scenario looks). Nothing after this step needs it.
        run: |
          docker compose stop demo-robot
          make compose-gate
      - name: lab artifacts (summaries, captures, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-lab-image
          path: |
            web/e2e/out/**/summary.*
            web/e2e/out/**/*.jsonl
            web/e2e/out/test-results/**
          if-no-files-found: ignore
      - name: stack logs on failure
        if: failure()
        run: docker compose --profile lab --profile stack --profile demo logs --no-color --tail 200 browser fjarr-server demo-robot demo-backend demo-dashboard

  tsan:
    # Its own job since 2026-10-02 (docs/30): it needs the dev image and the sysctl, not the stack.
    name: Agent under ThreadSanitizer (dev image)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      packages: write # the CI images (docs/30#ci-images)
    steps:
      - uses: actions/checkout@v4
      - name: the runner's .env (uid, groups)
        run: bash tools/ci/runner-env.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: the dev image by content hash (docs/30#ci-images)
        run: python3 tools/ci/image.py compose dev
      - uses: actions/cache/restore@v4
        with:
          path: build/ccache-dev
          key: ccache-dev-tsan-${{ github.run_id }}
          restore-keys: ccache-dev-tsan-
      - name: unit + loop tests under ThreadSanitizer (a gate, docs/15; runner-level because of the sysctl)
        run: |
          # TSan's shadow layout vs 32-bit ASLR entropy (docs/12); `-n` never prompts.
          [ "$(cat /proc/sys/vm/mmap_rnd_bits)" -le 28 ] || sudo -n sysctl -w vm.mmap_rnd_bits=28
          docker compose up -d dev
          docker compose exec -T -e CCACHE_DIR=/workspace/build/ccache-dev -e CCACHE_MAXSIZE=500M dev sh -c 'ccache -z >/dev/null; make agent-test-tsan; rc=$?; ccache -s; exit $rc'
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && env.FJARR_CI_PUSH == '1' }}
        with:
          path: build/ccache-dev
          key: ccache-dev-tsan-${{ github.run_id }}

  desktop-fixture:
    # Backend E's compositor half on every push (M3 slice 3.0, ADR-0033): GNOME's mutter headless in a
    # container, no GPU — capture from its PipeWire stream and input through EIS, checked by reading the
    # test window's pixels and its log (docs/15#the-desktop-test-lab).
    name: Desktop lab (headless mutter — capture + EIS input; fjarr-lab)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      packages: write # the CI images (docs/30#ci-images)
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: the fixture image by content hash (docs/30#ci-images)
        run: python3 tools/ci/image.py compose desktop-fixture
      - run: make desktop-fixture-test
      # fjarr-lab, the lab machines' schedule (docs/12#lab-machines-and-fjarr-lab): its logic against
      # fake systemctl and pgrep, with shellcheck, here because it is the lab's other half.
      - name: fjarr-lab — tests and shellcheck
        run: |
          make lab-test
          docker run --rm -v "$PWD/tools/fjarr-lab":/mnt:ro koalaman/shellcheck:stable -x fjarr-lab test.sh

  rust:
    name: Signaling (test + clippy + fmt)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: signaling
    steps:
      - uses: actions/checkout@v4
      # rustup reads signaling/rust-toolchain.toml automatically
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: signaling
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # macOS is fjarr-connect's committed second platform (ADR-0024), and `shell` builds for Windows
      # too (docs/27#shell); there is no runner for either, so the platform code is type-checked for
      # both here. This does not link the binary — webrtc-rs pulls `ring`, whose build script needs
      # each platform's SDK — and nothing runs on macOS or Windows (docs/04).
      # The script installs the target on the pinned toolchain itself, because its scratch crate sits
      # outside the workspace and would otherwise pick up whichever toolchain rustup defaults to.
      - run: bash ../docker/lab/platform-check.sh crates/fjarr-connect/src

  cpp:
    name: Agent + demo-robot build (Ubuntu 26.04 / GStreamer 1.28)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 600M
    # The baseline (ADR-0022) is newer than the hosted runner: build inside
    # the baseline image so the toolchain matches the dev container.
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - name: install build deps (mirror of .devcontainer/Dockerfile groups)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates build-essential cmake ninja-build ccache pkg-config make \
            clang-21 libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-nice nlohmann-json3-dev libtomlplusplus-dev \
            libsoup-3.0-dev libsystemd-dev libgtest-dev libnice-dev libei-dev libxkbcommon-dev libpipewire-0.3-dev libx11-dev libxtst-dev libxfixes-dev libxrandr-dev
      # One entry, saved from main and pruned after (docs/30#caches). hendrikmuhs/ccache-action saved a
      # new 475 MB copy on every run and filled the repository's 10 GB with them.
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-cpp-${{ github.run_id }}
          restore-keys: ccache-cpp-
      - run: ccache -z
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: ctest --preset release --output-on-failure
      - name: RAII kit gate (docs/23 memory ladder)
        run: make agent-raii-gate
      - name: the leaks-tracer bracketing catches a deliberate leak (docs/23 ladder layer 3)
        run: make agent-leaks-selftest
      - name: unit + loop tests under ASan/UBSan/LSan (a gate, docs/15)
        run: |
          cmake --preset asan
          cmake --build --preset asan
          ctest --preset asan --output-on-failure
      - run: ccache -s
        if: ${{ !cancelled() }}
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && env.FJARR_CI_PUSH == '1' }}
        with:
          path: .ccache
          key: ccache-cpp-${{ github.run_id }}
      # ADR-0011 license policy is enforced structurally too:
      - name: assert no GPL plugin package in the dependency docs
        run: "! grep -i 'plugins-ugly' CMakeLists.txt agent/CMakeLists.txt"

  server-image:
    name: fjarr-server production image
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: every workspace member is in the Dockerfile's dependency layer
        # cargo cannot resolve the workspace without every member's manifest, so a crate added to
        # signaling/ and not to docker/signaling/Dockerfile breaks this image and the browser lab that
        # builds it — which is what fjarr-netdev did, unnoticed for four pushes (2026-09-28).
        run: |
          missing=$(python3 -c "import tomllib; print(' '.join(tomllib.load(open('signaling/Cargo.toml','rb'))['workspace']['members']))" \
            | tr ' ' '\n' | while read -r m; do grep -q "COPY $m/Cargo.toml" docker/signaling/Dockerfile || echo "$m"; done)
          [ -z "$missing" ] || { echo "missing from docker/signaling/Dockerfile: $missing"; exit 1; }
      - name: build standalone from signaling/ only
        run: docker build -f docker/signaling/Dockerfile signaling/

  packages:
    # docs/26#releases, ADR-0031: the .debs built natively per architecture — never emulated — and
    # installed on a clean Ubuntu 26.04 that checks what they promise (packaging/install-test.sh).
    name: packages (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      packages: write # the CI images (docs/30#ci-images)
    env:
      DEB_BUILDER: prebuilt # pulled by content hash below
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: the deb builder by content hash (docs/30#ci-images)
        run: python3 tools/ci/image.py build fjarr-deb-builder docker/deb-builder
      - name: build the .debs
        run: make deb DEB_ARCH=${{ matrix.arch }}
      - name: install them on a clean Ubuntu 26.04
        run: make deb-install-test DEB_ARCH=${{ matrix.arch }}
      - name: embed libfjarr from the package (demo-robot out of tree)
        run: make deb-embed-test DEB_ARCH=${{ matrix.arch }}
      # amd64's image is built and run by agent-image, from these same files.
      - name: the runtime image builds from them (what release.yml publishes)
        if: matrix.arch == 'arm64'
        run: docker build -f docker/agent/Dockerfile --target runtime -t fjarr-agent:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: dist/deb/${{ matrix.arch }}/*.deb
          retention-days: 14

  cache-prune:
    # One entry per cache (docs/30#caches): the saves above add one each on main; this deletes the
    # older ones. After the saving jobs, whatever their result.
    name: Keep one entry per cache
    runs-on: ubuntu-24.04
    needs: [changes, cpp, e2e, tsan]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true' }}
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/cache-prune.sh ccache-cpp- ccache-dev-release- ccache-dev-tsan-
