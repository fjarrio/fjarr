# Fjarr nightly — the memory ladder's slow rungs and the profiles (docs/15 "What CI runs",
# docs/23 memory ladder): the 200-cycle soak, valgrind memcheck, heaptrack, the netem
# scenarios. Runs on GitHub's hosted runner by default (software encoder only); set the
# repository variable FJARR_NIGHTLY_RUNNER to a self-hosted runner's label to measure the
# VA-API path on a machine with an Intel iGPU (docs/12 "Nightly CI and the self-hosted GPU runner").
name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      soak_cycles:
        description: soak cycles
        default: "200"

jobs:
  nightly:
    name: Soak, memcheck, heaptrack, netem (${{ vars.FJARR_NIGHTLY_RUNNER || 'ubuntu-24.04' }})
    runs-on: ${{ vars.FJARR_NIGHTLY_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: environment (the runner's ids, GPU groups when present, TSan sysctl)
        run: |
          cp .env.example .env
          sed -i "s/^USER_UID=.*/USER_UID=$(id -u)/; s/^USER_GID=.*/USER_GID=$(id -g)/; s#^DOCKER_GID=.*#DOCKER_GID=$(stat -c %g /var/run/docker.sock)#" .env
          if [ -e /dev/dri/renderD128 ]; then
            sed -i "s/^RENDER_GID=.*/RENDER_GID=$(stat -c %g /dev/dri/renderD128)/" .env
            echo "render node present; whether it can ENCODE is decided by probing, below"
          else
            # `sudo -n` never prompts. A self-hosted runner started interactively HAS a
            # terminal, so a plain `sudo` there does not fail — it waits for a password
            # forever, and the job hangs with no error to read.
            sudo -n mkdir -p /dev/dri 2>/dev/null || mkdir -p /dev/dri 2>/dev/null \
              || echo "no /dev/dri and cannot create it without sudo; compose maps nothing"
          fi
          # TSan needs <= 28 bits of ASLR entropy. Prefer the value already set: a
          # self-hosted runner should carry it in /etc/sysctl.d (docs/12), and then this
          # needs no privileges at all.
          if [ "$(cat /proc/sys/vm/mmap_rnd_bits)" -le 28 ]; then
            echo "vm.mmap_rnd_bits=$(cat /proc/sys/vm/mmap_rnd_bits): TSan-compatible already"
          elif sudo -n sysctl -w vm.mmap_rnd_bits=28 >/dev/null 2>&1; then
            echo "vm.mmap_rnd_bits lowered to 28 for this run"
          else
            echo "::warning::vm.mmap_rnd_bits=$(cat /proc/sys/vm/mmap_rnd_bits) and no passwordless sudo — TSan will be skipped. Persist it on the runner: echo 'vm.mmap_rnd_bits=28' | sudo tee /etc/sysctl.d/60-tsan.conf && sudo sysctl --system"
          fi
          grep -E "^(USER_UID|USER_GID|DOCKER_GID|RENDER_GID)=" .env
      - name: build the dev image
        run: |
          docker compose build dev
          docker compose up -d dev robot-sim
      - name: choose the encoder by probing VA-API, not by the presence of a device
        # A render node is not an Intel one. An NVIDIA card presents /dev/dri/renderD128
        # and no VA-API H.264 encoder, while our hardware path IS VA-API (ADR-0022; NVENC
        # is open question #2). Trusting the device node put such a runner on
        # `media.encoder=auto`, where the agent correctly refuses to start rather than
        # fall back silently (docs/23) — a green machine failing for the right reason at
        # the wrong time. Running the pipeline is the only honest test.
        run: |
          if docker compose exec -T dev sh -c 'timeout 30 gst-launch-1.0 -q videotestsrc num-buffers=10 ! vapostproc ! vah264enc ! fakesink' >/dev/null 2>&1; then
            echo "VA-API H.264 encode works here: media.encoder=auto"
            echo "FJARR_MEDIA_ENCODER=auto" >> "$GITHUB_ENV"
          else
            echo "no usable VA-API H.264 encoder on this runner: media.encoder=software (deliberate, docs/23)"
            echo "FJARR_MEDIA_ENCODER=software" >> "$GITHUB_ENV"
          fi
      - name: doctor and the agent build
        run: |
          docker compose exec -T -e FJARR_MEDIA_ENCODER="$FJARR_MEDIA_ENCODER" dev make doctor
          docker compose exec -T dev make agent-build
      - name: valgrind memcheck on the loop tests (docs/15 nightly row)
        run: docker compose exec -T dev make agent-memcheck
      - name: heaptrack on the streaming loop test (docs/16 hot-path budget)
        run: docker compose exec -T dev make agent-heaptrack
      - name: start the demo stack (fjarr-server, demo backend, the real agent)
        run: |
          # coturn belongs here, not only in the latency step: .env now configures TURN for
          # every session, so without it each one spends time failing to resolve a server
          # that is not running ("Can't resolve TURN server coturn"). CI starts it; this
          # job must match, or the two measure different stacks.
          docker compose --profile stack up -d --build --wait fjarr-server coturn
          docker compose --profile demo --profile stack up -d demo-backend demo-robot
          sleep 8 && docker compose logs --no-color demo-robot | tail -10
      - name: the ${{ inputs.soak_cycles || '200' }}-cycle soak (docs/16 census + RSS budget)
        run: make opsim-soak OPSIM_CYCLES=${{ inputs.soak_cycles || '200' }}
      - name: one opsim scenario under the leaks tracer (docs/23 ladder layer 3)
        run: make agent-leaks SCENARIO=hotplug
      - name: netem scenarios (docs/25 profiles on the agent's interface; `bad` joins when slice 6 brings loss recovery + adaptive bitrate)
        run: |
          for p in wifi-ok 4g lossy; do make opsim-netem NETEM_PROFILE=$p; done
      # The latency harness is a browser suite, so this job needs node as well as make.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser suites import @fjarr/core from its BUILT output, and the lab page is a Vite
      # app that does the same. Installing is not enough: without this the run dies with
      # "Cannot find module .../@fjarr/core/dist/index.js" and reports "No tests found",
      # which reads like a harness misconfiguration rather than a missing build.
      # Packages only, deliberately: this job runs the latency and @heavy suites, neither of
      # which needs the introspection viewer app, and building it on a persistent self-hosted
      # runner tripped over a dist/ directory an earlier run had left owned by root.
      - run: pnpm -r --filter './web/packages/**' build
      - name: glass-to-glass latency (docs/15 latency harness, slice 7b)
        # The docs/16 budgets are NUC-class numbers, so STRICT belongs on the prepared
        # machine only: set the repository variable FJARR_LATENCY_STRICT=1 once
        # FJARR_NIGHTLY_RUNNER points at it. Until then this measures and records, and the
        # harness itself withholds a verdict on a run that could not decode the source rate.
        env:
          E2E_BROWSER: http://localhost:9222
          E2E_PAGE_ORIGIN: http://host.docker.internal:5174
          E2E_SERVER_WS: ws://fjarr-server:8080/ws
          E2E_SERVER_HTTP: http://localhost:8080
          E2E_INTROSPECT_HTTP: http://localhost:7381
          E2E_LATENCY_LABEL: ${{ vars.FJARR_LATENCY_LABEL || vars.FJARR_NIGHTLY_RUNNER || 'github-hosted' }}
          E2E_LATENCY_STRICT: ${{ vars.FJARR_LATENCY_STRICT || '0' }}
          CI: "true"
        run: |
          docker compose --profile lab --profile stack up -d --build --wait browser coturn
          pnpm --filter '@fjarr/e2e' exec playwright test tests/stack/latency.spec.ts --project stack
      - name: profiles and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ github.run_number }}
          path: |
            build/memcheck/**
            build/heaptrack/**
            web/e2e/latency.csv
            web/e2e/out/**/summary.*
          if-no-files-found: ignore
      - name: stack logs on failure
        if: failure()
        run: docker compose --profile stack --profile demo logs --no-color --tail 200 fjarr-server demo-robot demo-backend
