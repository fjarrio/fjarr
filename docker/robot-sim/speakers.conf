# The X11 fixture kiosk's speakers (M3.5 3.5.2, ADR-0034), as the GNOME fixture's: a null sink as the default
# output, so what the kiosk plays has somewhere to go and the agent something to hear. plugd_x11.py's
# /speakers?use= adds others and switches the default.
context.objects = [
    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = fixture-speakers
          node.description = "Fixture speakers"
          media.class      = Audio/Sink
          audio.position   = [ FL FR ]
      }
    }
]
