# The fixture's speakers (M3.5 3.5.2, docs/23#desktop-audio): a null sink as the desktop's default
# output, as a robot with a sound card has one, so what the desktop plays has somewhere to go and the
# agent something to hear. fixture-plugd's /speakers?use= adds others and switches the default.
context.objects = [
    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = fixture-speakers
          node.description = "Fixture speakers"
          media.class      = Audio/Sink
          audio.position   = [ FL FR ]
      }
    }
]
